<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hatchbox Games</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Source+Sans+3:wght@400;600&display=swap">
<style>
  :root { --bg:#fbf6ee; --fg:#2a2033; --muted:#6c5f75; --card:#ffffff; --line:#eadfce; --accent:#e8892b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f0b16; --fg:#f4ecdf; --muted:#b8aac2; --card:#1a1424; --line:#2c2236; --accent:#ffc14d; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 "Source Sans 3", system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font-family: "Lilita One", system-ui, sans-serif; font-weight: 400; font-size: 2.6rem; margin: 0 0 4px; color: var(--accent); }
  .lead { color: var(--muted); margin: 0 0 32px; }
  ul { list-style: none; padding: 0; margin: 0 0 32px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  li { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-weight: 600; }
  a { color: var(--accent); }
  footer { color: var(--muted); font-size: .95rem; border-top: 1px solid var(--line); padding-top: 16px; }
</style>
</head>
<body>
<main>
  <h1>Hatchbox Games</h1>
  <p class="lead">Small studio making original, skill-based mobile games with painted art and fair monetization.</p>
  <ul>
    <li>Maze Raiders</li>
    <li>Titan Duel</li>
    <li>Chaos Cup</li>
    <li>Riftwalker</li>
    <li>Shadeling</li>
    <li>Lantern Legion</li>
    <li>Oasis Keeper</li>
  </ul>
  <footer>
    <a href="privacy/">Privacy policy</a> &middot; Support: <a href="mailto:mohamedahmw21@gmail.com">mohamedahmw21@gmail.com</a>
  </footer>
</main>
</body>
</html>
